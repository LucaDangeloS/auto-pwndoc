networks:
  autopwndoc-net:
    driver: bridge

services:
  mongodb:
    image: mongo:4.2.15
    container_name: autopwndoc-mongodb
    networks:
      - autopwndoc-net
    volumes:
      # Host-owned ground truth: independent from the Compose project name and
      # unaffected by `docker compose down -v`.
      - ${MONGO_DATA_PATH:-./backend/mongo-data}:/data/db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: pwndoc
    healthcheck:
      test: ["CMD-SHELL", "mongo --quiet --eval \"quit(db.adminCommand({ping:1}).ok ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: autopwndoc/backend:prod
    container_name: autopwndoc-backend
    networks:
      - autopwndoc-net
    volumes:
      - ./backend/report-templates:/app/report-templates
      - ./backend/audit-archives:/app/audit-archives
      - ./backend/backups:/app/backups
      - ./backend/ssl:/app/ssl:ro
      - ./backend/src/config:/app/src/config
    depends_on:
      mongodb:
        condition: service_healthy
      chroma:
        condition: service_started
      languagetool:
        condition: service_started
    environment:
      COLLAB_WEBSOCKET_PORT: 8440
      APP_URL: ${APP_URL:-https://localhost:8443}
    restart: always
    expose:
      - "4242"
      - "8440"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('https').get({host:'localhost',port:4242,path:'/api/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: autopwndoc/frontend:prod
    container_name: autopwndoc-frontend
    networks:
      - autopwndoc-net
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    ports:
      - "${APP_PORT:-8443}:8443"

  chroma:
    image: chromadb/chroma:1.5.5
    container_name: autopwndoc-chroma
    networks:
      - autopwndoc-net
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    restart: always

  languagetool:
    image: erikvl87/languagetool
    container_name: autopwndoc-languagetool
    networks:
      - autopwndoc-net
    restart: always

volumes:
  chroma-data:
