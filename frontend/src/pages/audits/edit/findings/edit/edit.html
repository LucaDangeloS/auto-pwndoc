<template>
    <div
      @input.capture="markUserEdited"
      @change.capture="markUserEdited"
      @paste.capture="markUserEdited"
      @cut.capture="markUserEdited"
      @drop.capture="markUserEdited"
    >
      <breadcrumb
        buttons
        :title="localAudit?.name ? `${localAudit.name} (${localAudit.auditType || 'Audit Type not set'})` : 'Loading...'"
        :state="parentState"
        :approvals="parentApprovals"
      >
        <template #buttons>
          <q-btn
            color="orange"
            class="q-mr-sm"
            :label="$t('btn.backupFinding')"
            no-caps
            :disable="loading"
            @click="backupFinding()"
          />
          <ai-action-btn
            v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
            class="q-mr-sm"
            :flat="false"
            :outline="true"
            :dense="false"
            color="purple"
            icon="manage_search"
            :label="$t('similarVulnSearch')"
            :loading="similarVulnLoading && !similarVulnIsProofMode"
            :disabled="loading || !aiSimilarReady"
            :disabled-reason="aiSimilarDisabledReason"
            :tooltip="$t('similarVulnSearchTooltip')"
            cancellable
            :cancel-hint="$t('btn.cancel')"
            @click="searchSimilarVulns()"
            @cancel="cancelSimilarSearch()"
          />
          <q-btn
            color="negative"
            class="q-mr-sm"
            :label="$t('btn.delete')"
            no-caps
            :disable="loading"
            @click="deleteFinding()"
            v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
          />
          <q-btn
            color="positive"
            :disable="loading || !readyToSave"
            :label="$t('btn.save') + ' (ctrl+s)'"
            no-caps
            @click="updateFinding()"
            v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
          />
        </template>
      </breadcrumb>

      <div class="row">
        <q-tabs
          v-model="selectedTab"
          align="left"
          indicator-color="primary"
          active-bg-color="grey-3"
          class="bg-white full-width"
        >
          <q-tab name="definition" default :label="$t('definition')" />
          <q-tab name="proofs" :label="$t('proofs')" />
          <q-tab v-if="localAudit && localAudit.isRetest" name="retest" :label="$t('retestEvidence')" />
          <q-tab name="details" :label="$t('details')" />
          <template v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT">
            <q-separator vertical />
            <q-toggle
              v-model="finding.status"
              @update:model-value="markUserEdited"
              :true-value="0"
              :false-value="1"
              checked-icon="check"
              unchecked-icon="clear"
              color="green"
              :disable="loading"
            >
              <template #default>
                <span class="row items-center no-wrap q-ml-xs">
                  {{ $t('completed') }}
                  <template-hint template-var="status" :description="$t('templateHintFindingScope')" />
                </span>
              </template>
            </q-toggle>
          </template>
          <q-space />
        </q-tabs>

        <q-tab-panels
          v-model="selectedTab"
          animated
          class="bg-transparent col-md-8 col-12 offset-md-2 q-mt-md"
          @before-transition="beforeTabTransition"
          @transition="updateOrig"
        >
          <!-- DEFINITION -->
          <q-tab-panel name="definition">
            <q-card>
              <q-inner-loading :showing="loading">
                <q-spinner size="40px" color="primary" />
              </q-inner-loading>
              <q-card-section class="row q-col-gutter-md">
                <q-input
                  class="col-md-12 col-12"
                  :label="$t('title') + ' *'"
                  stack-label
                  v-model="finding.title"
                  @update:model-value="markUserEdited"
                  outlined
                  :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                >
                  <template #append><template-hint template-var="title" :description="$t('templateHintFindingScope')" /></template>
                </q-input>

                <div class="col-md-12 col-12 q-mt-sm">
                  <taxonomy-picker
                    v-model="finding.taxonomies"
                    @update:model-value="markUserEdited"
                    :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  />
                </div>

                <div class="col-md-12 row items-center q-mt-sm">
                  <span class="row items-center text-subtitle2 text-grey-7">
                    {{ $t('description') }}
                    <template-hint
                      template-var="{#description}{@text | convertHTML}{#images}{%image}{caption}{/images}{/description}"
                      :description="$t('templateHintRichTextFinding')"
                      class="q-ml-xs"
                    />
                  </span>
                </div>
                <q-field class="col-md-12 basic-editor" borderless stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_description"
                      v-model="finding.description"
                      v-on:ready="onEditorReady"
                      v-on:editorchange="markUserEdited"
                      idUnique="basiceditor_description"
                      fieldName="description"
                      :aiContext="findingAiContext()"
                      noSync
                      :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </template>
                </q-field>

                <div class="col-md-12 row items-center q-mt-sm">
                  <span class="row items-center text-subtitle2 text-grey-7">
                    {{ $t('observation') }}
                    <template-hint
                      template-var="{#observation}{@text | convertHTML}{#images}{%image}{caption}{/images}{/observation}"
                      :description="$t('templateHintRichTextFinding')"
                      class="q-ml-xs"
                    />
                  </span>
                </div>
                <q-field class="col-md-12 basic-editor" borderless stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_observation"
                      v-model="finding.observation"
                      v-on:editorchange="markUserEdited"
                      idUnique="basiceditor_observation"
                      fieldName="observation"
                      :aiContext="findingAiContext()"
                      noSync
                      :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </template>
                </q-field>

                <div class="col-12">
                  <div class="row items-center q-mb-xs">
                    <span class="text-subtitle2 text-grey-7">{{ $t('references') }}</span>
                    <template-hint
                      template-var="{#references}{.}{/references}"
                      :description="$t('templateHintFindingScope')"
                      :examples="['{@references_links}']"
                      class="q-ml-xs"
                    />
                  </div>
                  <textarea-array
                    v-model="finding.references"
                    @update:model-value="markUserEdited"
                    :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  />
                </div>
              </q-card-section>

            </q-card>
          </q-tab-panel>

          <!-- PROOFS -->
          <q-tab-panel name="proofs">
            <div class="q-col-gutter-md row">
              <div class="col-12">
                <q-card>
                  <q-inner-loading :showing="loading">
                    <q-spinner size="40px" color="primary" />
                  </q-inner-loading>
                  <q-card-section class="row items-center justify-between q-pb-none">
                    <span class="row items-center text-subtitle2 text-grey-7">
                      {{ $t('proofs') }}
                      <template-hint
                        template-var="{#poc}{@text | convertHTML}{#images}{%image}{caption}{/images}{/poc}"
                        :description="$t('templateHintRichTextFinding')"
                        class="q-ml-xs"
                      />
                    </span>
                    <div
                      v-if="frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                      class="row items-center q-gutter-sm"
                    >
                      <q-toggle
                        v-model="proofOverwriteFilledFields"
                        dense
                        color="primary"
                        :label="$t('proofOverwriteFilledFields')"
                      >
                        <q-tooltip>{{ $t('proofOverwriteFilledFieldsTooltip') }}</q-tooltip>
                      </q-toggle>
                      <ai-action-btn
                        :flat="false"
                        :outline="true"
                        :dense="false"
                        size="sm"
                        color="purple"
                        icon="image_search"
                        :label="$t('searchSimilarFromProofs')"
                        :loading="similarVulnLoading && similarVulnIsProofMode"
                        :disabled="loading || !aiVisionReady"
                        :disabled-reason="aiVisionDisabledReason"
                        :tooltip="$t('searchSimilarFromProofsTooltip')"
                        cancellable
                        :cancel-hint="$t('btn.cancel')"
                        @click="searchSimilarFromProofs()"
                        @cancel="cancelSimilarSearch()"
                      />
                    </div>
                  </q-card-section>
                  <q-card-section>
                    <basic-editor
                      ref="basiceditor_poc"
                      v-model="finding.poc"
                      v-on:ready="onEditorReady('poc')"
                      v-on:editorchange="markUserEdited"
                      idUnique="basiceditor_poc"
                      fieldName="poc"
                      :aiContext="findingAiContext()"
                      noSync
                      :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </q-card-section>
                </q-card>
              </div>
            </div>
          </q-tab-panel>

          <!-- RETEST EVIDENCE -->
          <q-tab-panel name="retest" v-if="localAudit && localAudit.isRetest">
            <div class="q-col-gutter-md row">
              <div class="col-12">
                <q-card>
                  <q-inner-loading :showing="loading">
                    <q-spinner size="40px" color="primary" />
                  </q-inner-loading>
                  <q-card-section class="row items-center q-pb-xs">
                    <span class="row items-center text-subtitle2">
                      {{ $t('retestResult') }}
                      <template-hint template-var="retest_passed" :description="$t('templateHintFindingScope')" class="q-ml-xs" />
                    </span>
                    <q-space />
                    <q-btn-toggle
                      v-model="finding.retestPassed"
                      @update:model-value="markUserEdited"
                      :options="[
                        { label: $t('retestFailed'), value: false },
                        { label: $t('retestPassed'), value: true }
                      ]"
                      :toggle-color="finding.retestPassed === true ? 'positive' : finding.retestPassed === false ? 'negative' : 'grey-5'"
                      unelevated
                      rounded
                      no-caps
                      :disable="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                    />
                    <q-btn
                      v-if="finding.retestPassed !== null && !loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                      flat dense round icon="clear" color="grey-6" size="sm"
                      class="q-ml-xs"
                      @click="markUserEdited(); finding.retestPassed = null"
                    >
                      <q-tooltip>{{ $t('retestClearResult') }}</q-tooltip>
                    </q-btn>
                  </q-card-section>

                  <q-separator />

                  <q-card-section>
                    <div class="row items-center q-mb-sm">
                      <span class="text-subtitle2 text-grey-7">{{ $t('retestEvidenceContent') }}</span>
                      <template-hint
                        template-var="{#retest_evidence}{@text | convertHTML}{#images}{%image}{caption}{/images}{/retest_evidence}"
                        :description="$t('templateHintRichTextFinding')"
                        class="q-ml-xs"
                      />
                    </div>
                    <basic-editor
                      ref="basiceditor_retestEvidence"
                      v-model="finding.retestEvidence"
                      v-on:ready="onEditorReady('retestEvidence')"
                      v-on:editorchange="markUserEdited"
                      idUnique="basiceditor_retestEvidence"
                      fieldName="retestEvidence"
                      :aiContext="findingAiContext(localAudit)"
                      noSync
                      :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </q-card-section>
                </q-card>
              </div>
            </div>
          </q-tab-panel>

          <!-- DETAILS -->
          <q-tab-panel name="details">
            <q-card>
              <q-inner-loading :showing="loading">
                <q-spinner size="40px" color="primary" />
              </q-inner-loading>
              <q-card-section>
                <span class="row items-center">
                  {{ $t('affectedAssets') }}
                  <template-hint template-var="{@affected | convertHTML}" :description="$t('templateHintFindingScope')" class="q-ml-xs" />
                </span>
              </q-card-section>
              <q-separator />
              <q-card-section>
                <basic-editor
                  ref="basiceditor_scope"
                  v-model="finding.scope"
                  v-on:ready="onEditorReady('scope')"
                  v-on:editorchange="markUserEdited"
                  idUnique="basiceditor_scope"
                  :toolbar="['format','marks','list']"
                  :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                />
              </q-card-section>
            </q-card>

            <q-card class="q-mt-md bg-grey-1">
              <q-inner-loading :showing="loading">
                <q-spinner size="40px" color="primary" />
              </q-inner-loading>
              <q-card-section class="row items-center q-pb-none">
                <span class="text-subtitle2 text-grey-7">{{ $t('cvssScore') }}</span>
                <template-hint
                  template-var="cvss.baseMetricScore"
                  :description="$t('templateHintFindingScope')"
                  :examples="['cvss.baseSeverity', 'cvss4.baseMetricScore', 'cvss4.baseSeverity']"
                  class="q-ml-xs"
                />
              </q-card-section>
              <div class="col-12" @pointerdown.capture="markUserEdited">
                <cvss-calculator-unified
                  :key="cvssCalculatorKey"
                  v-model="finding.cvssv3"
                  v-model:cvssv4Value="finding.cvssv4"
                  :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                />
              </div>
            </q-card>

            <q-card class="q-mt-md">
              <q-inner-loading :showing="loading">
                <q-spinner size="40px" color="primary" />
              </q-inner-loading>
              <q-card-section>{{ $t('courseOfActions') }}</q-card-section>
              <q-separator />
              <q-card-section>
                <div class="q-col-gutter-md row">
                  <q-select
                    :label="$t('remediationDifficulty')"
                    stack-label
                    class="col-md-6 col-12"
                    v-model="finding.remediationComplexity"
                    @update:model-value="markUserEdited"
                    :options="[
                      { label: $t('easy'), value: 1 },
                      { label: $t('medium'), value: 2 },
                      { label: $t('complex'), value: 3 }
                    ]"
                    map-options
                    emit-value
                    options-sanitize
                    outlined
                    :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  >
                    <template #append><template-hint template-var="remediationComplexity" :description="$t('templateHintFindingScope')" /></template>
                  </q-select>
                  <q-select
                    :label="$t('priority')"
                    stack-label
                    class="col-md-6 col-12"
                    v-model="finding.priority"
                    @update:model-value="markUserEdited"
                    :options="[
                      { label: $t('low'), value: 1 },
                      { label: $t('medium'), value: 2 },
                      { label: $t('high'), value: 3 },
                      { label: $t('urgent'), value: 4 }
                    ]"
                    map-options
                    emit-value
                    options-sanitize
                    outlined
                    :readonly="loading || frontEndAuditState !== AUDIT_VIEW_STATE.EDIT"
                  >
                    <template #append><template-hint template-var="priority" :description="$t('templateHintFindingScope')" /></template>
                  </q-select>
                </div>
                <div class="col-md-12 row items-center q-mt-md q-mb-xs">
                  <span class="row items-center text-subtitle2 text-grey-7">
                    {{ $t('remediation') }}
                    <template-hint
                      template-var="{#remediation}{@text | convertHTML}{#images}{%image}{caption}{/images}{/remediation}"
                      :description="$t('templateHintRichTextFinding')"
                      class="q-ml-xs"
                    />
                  </span>
                </div>
                <q-field class="col-md-12 basic-editor" borderless stack-label>
                  <template #control>
                    <basic-editor
                      ref="basiceditor_remediation"
                      v-model="finding.remediation"
                      v-on:ready="onEditorReady('remediation')"
                      v-on:editorchange="markUserEdited"
                      idUnique="basiceditor_remediation"
                      fieldName="remediation"
                      :aiContext="findingAiContext()"
                      noSync
                      :editable="!loading && frontEndAuditState === AUDIT_VIEW_STATE.EDIT"
                    />
                  </template>
                </q-field>
              </q-card-section>
            </q-card>
          </q-tab-panel>
        </q-tab-panels>
      </div>

      <similar-vuln-modal
        v-model="similarVulnModalOpen"
        :results="similarVulnResults"
        :loading="similarVulnLoading"
        :error="similarVulnError"
        :current-finding="finding"
        :is-proof-mode="similarVulnIsProofMode"
        :vision-summary="proofVisionSummary"
        :proof-steps="proofCompletionSteps"
        @apply="applySimilarVuln"
        @select="onProofResultSelected"
        @retry="similarVulnIsProofMode ? searchSimilarFromProofs() : searchSimilarVulns()"
        @close="onSimilarModalClose"
      />
    </div>
  </template>
