    <q-card style="width: 900px; max-width: 90vw">
        <q-bar class="bg-fixed-primary text-white">
            <span>{{$t('automaticVulnerabilityMatching')}}</span>
            <q-space />
            <q-btn dense flat icon="close" @click="closeMatchingDialog" />
        </q-bar>
        <q-card-section>
            <div class="text-body2 q-mb-md">{{$t('automaticVulnerabilityMatchingWarning')}}</div>
            <div class="row q-col-gutter-md">
                <q-select class="col-12 col-md-6" v-model="matchingScope" :label="$t('matchingScope')" :options="[{label: $t('unmappedOnly'), value: 'unmapped'}, {label: $t('allVulnerabilities'), value: 'all'}]" emit-value map-options outlined :disable="matchingStatus.inProgress" />
                <q-input class="col-12 col-md-6" type="number" step="0.1" min="0" v-model.number="matchingThreshold" :label="$t('matchingThreshold')" :hint="$t('matchingThresholdHint')" outlined :disable="matchingStatus.inProgress" />
            </div>
            <div v-if="matchingStatus.inProgress || matchingStatus.total > 0" class="q-mt-md">
                <div class="text-caption q-mb-xs">{{$t('matchingProgress', {processed: matchingStatus.processed, total: matchingStatus.total})}}</div>
                <q-linear-progress :value="matchingStatus.total > 0 ? matchingStatus.processed / matchingStatus.total : 0" rounded color="secondary" />
            </div>
            <div v-if="matchingStatus.proposals && matchingStatus.proposals.length" class="row items-center justify-between q-mt-md">
                <div class="text-caption">{{ $t('matchingPendingCount', {count: pendingMatchingProposals.length}) }}</div>
                <div class="row items-center q-gutter-sm">
                    <q-checkbox
                        dense
                        :model-value="allVisiblePendingMatchingSelected"
                        :label="$t('selectAllPending')"
                        :disable="!visiblePendingMatchingProposals.length"
                        @update:model-value="toggleAllVisiblePendingMatching"
                    />
                    <q-select
                        dense
                        outlined
                        emit-value
                        map-options
                        style="min-width: 180px"
                        v-model="matchingSort"
                        :label="$t('sortByMatchingScore')"
                        :options="matchingSortOptions"
                    />
                    <q-toggle dense v-model="showMatchingHistory" :label="$t('showMatchingHistory')" />
                </div>
            </div>
            <q-list v-if="visibleMatchingProposals.length" bordered separator class="q-mt-sm">
                <q-item v-for="proposal in visibleMatchingProposals" :key="proposal.sourceVulnId + proposal.targetVulnId + proposal.sourceLocale + proposal.targetLocale">
                    <q-item-section side>
                        <q-checkbox v-model="selectedMatchingProposals" :val="proposal" :disable="!isPendingProposal(proposal)" />
                    </q-item-section>
                    <q-item-section>
                        <q-item-label>
                            {{ proposal.sourceTitle }} → {{ proposal.targetTitle }}
                            <q-badge :color="matchingProposalStatusColor(proposal)" class="q-ml-sm">{{ matchingProposalStatusLabel(proposal) }}</q-badge>
                        </q-item-label>
                        <q-item-label caption>{{ proposal.sourceLocale }} → {{ proposal.targetLocale }} · {{ $t('matchingScore') }}: {{ matchingScore(proposal) }}% · {{ $t('distance') }}: {{ proposal.distance }}</q-item-label>
                    </q-item-section>
                </q-item>
            </q-list>
            <div v-else-if="matchingStatus.proposals && matchingStatus.proposals.length" class="text-caption text-grey-7 q-mt-sm">
                {{$t('matchingNoPendingProposals')}}
            </div>
        </q-card-section>
        <q-card-actions align="right">
            <q-btn outline color="primary" no-caps :label="$t('startMatching')" :loading="matchingStatus.inProgress" :disable="matchingStatus.inProgress" @click="startMatching" />
            <q-btn color="secondary" unelevated no-caps :label="$t('applySelectedMappings')" :disable="selectedPendingMatchingProposals.length === 0 || matchingStatus.inProgress" @click="applyMatchingProposals" />
